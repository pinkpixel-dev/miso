# Builds and publishes the Miso image when a version tag is pushed.
#
# The manual push of 1.0.0 is what this automates, so it does the same things
# for the same reasons: amd64 only, because CUDA plus the NVIDIA container
# toolkit is effectively amd64 outside Jetson boards and a second architecture
# doubles the build for nobody. Attestations are off, because they add
# unknown/unknown entries to the package listing and nothing here consumes them.
#
# It runs the tests first. This is the only gate on what gets published, since
# there is no separate CI workflow, and an image that fails its own test suite
# should not reach a tag people can pull.

name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build, for example v1.0.0'
        required: true

permissions:
  contents: read
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      # --ignore-scripts for the same reason the Dockerfile uses it:
      # better-sqlite3 ships prebuilds but also a binding.gyp, and npm runs
      # node-gyp for that pair regardless.
      - run: npm ci --ignore-scripts

      - run: npm run typecheck
      - run: npm test

      # The tag and package.json disagreeing means one of them is wrong, and
      # publishing either way produces an image whose /api/health lies about
      # which release it is.
      #
      # This also decides the image tags, because the alternative does not work.
      # docker/metadata-action reads the event ref, not what was checked out, so
      # on a manual dispatch from main its semver patterns match nothing and it
      # emits no tags at all. The build then fails with "tag is needed when
      # pushing to registry", which is a confusing way to be told that.
      - name: Check the tag matches package.json
        id: version
        run: |
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          want="${tag#v}"
          have="$(node -p "require('./package.json').version")"
          if [ "$want" != "$have" ]; then
            echo "Tag $tag wants version $want, package.json says $have."
            exit 1
          fi
          echo "Both say $have."
          echo "version=$have" >> "$GITHUB_OUTPUT"
          # A prerelease carries a hyphen, as in 1.1.0-rc.1, and must not become
          # what everybody pulls by default.
          case "$have" in
            *-*) echo "stable=false" >> "$GITHUB_OUTPUT" ;;
            *)   echo "stable=true"  >> "$GITHUB_OUTPUT" ;;
          esac

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Labels are not set here. They are LABEL instructions in the Dockerfile,
      # so a local build carries the same ones as a released build.
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          provenance: false
          sbom: false
          tags: |
            ghcr.io/${{ github.repository }}:${{ steps.version.outputs.version }}
            ${{ steps.version.outputs.stable == 'true' && format('ghcr.io/{0}:latest', github.repository) || '' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
